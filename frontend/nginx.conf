# Manage tokens (/r/<token>, /api/registrations/<token>) are credentials: log a redacted URI
# and no Referer (the ticket page would send its own URL as Referer). docs/REVIEW.md H2.
map $request_uri $redacted_uri {
    ~^(?<prefix>/api/registrations/|/r/)[A-Za-z0-9_-]+(?<rest>.*)$  "${prefix}[redacted]${rest}";
    default                                                          $request_uri;
}
log_format redacted '$remote_addr - [$time_local] "$request_method $redacted_uri $server_protocol" '
                    '$status $body_bytes_sent "$http_user_agent"';

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    access_log /var/log/nginx/access.log redacted;
    # Browsers must not send the ticket URL (with its token) as Referer anywhere.
    add_header Referrer-Policy "no-referrer" always;

    # API: forwarded over the compose network to the backend container (DECISIONS D-017).
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Needed for SSE in phase 5; harmless for normal JSON calls.
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    # SPA: unknown paths fall back to index.html so client-side routes work on reload.
    location / {
        try_files $uri /index.html;
    }
}
