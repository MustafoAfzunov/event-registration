server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # API: forwarded over the compose network to the backend container (DECISIONS D-017).
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Needed for SSE in phase 5; harmless for normal JSON calls.
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    # SPA: unknown paths fall back to index.html so client-side routes work on reload.
    location / {
        try_files $uri /index.html;
    }
}
