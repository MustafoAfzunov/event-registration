[alembic]
script_location = %(here)s/alembic
# Make the `app` package importable from env.py when running the alembic CLI.
prepend_sys_path = .
path_separator = os
# The URL is not configured here; env.py reads it from app settings (DATABASE_URL)
# unless a caller (e.g. the test suite) sets sqlalchemy.url programmatically.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
